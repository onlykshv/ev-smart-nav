<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EV Smart Navigator — Global Station Map</title>
  <meta name="description" content="Explore every EV charging station in the world — 242,000+ stations with power class, ports, and fast-DC info."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    /* Station map overrides */
    body { overflow: hidden; }
    .stations-layout { display: flex; flex-direction: column; height: 100vh; padding-top: 56px; }
    #stationsMap { flex: 1; }

    /* Toolbar below nav */
    .stations-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(13,17,23,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      flex-wrap: wrap;
      z-index: 50;
    }
    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .toolbar-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .toolbar-sep { flex: 1; }

    /* Filter toggles */
    .filter-group { display: flex; gap: 6px; align-items: center; }
    .filter-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-glass);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .filter-btn:hover  { color: var(--text-primary); border-color: rgba(255,255,255,.2); }
    .filter-btn.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(74,222,128,.4); }
    .filter-btn.active.fast { background: rgba(96,165,250,.12); color: var(--accent2); border-color: rgba(96,165,250,.4); }

    /* Loading overlay */
    #loadingOverlay {
      position: absolute;
      bottom: 20px; right: 20px;
      background: rgba(13,17,23,.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }
    #loadingOverlay.show { opacity: 1; }
    .load-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

    /* Power class legend */
    .map-float-legend {
      position: absolute;
      bottom: 20px; left: 20px;
      background: rgba(13,17,23,.88);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 11px;
      z-index: 400;
      backdrop-filter: blur(12px);
    }
    .map-float-legend h4 { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
    .legend-row { display: flex; align-items: center; gap: 7px; margin: 4px 0; color: var(--text-primary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-icon">⚡</span>
    <span>EV Smart Navigator</span>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link">🗺️ Route Planner</a>
    <a href="/stations" class="nav-link active">🔌 Station Map</a>
    <a href="/dashboard" class="nav-link">📊 Dashboard</a>
  </div>
</nav>

<div class="stations-layout">

  <!-- TOOLBAR -->
  <div class="stations-toolbar">
    <div class="toolbar-title">🌐 Global Charging Station Map</div>
    <div class="toolbar-count" id="stationCount">Loading stations…</div>
    <div class="toolbar-sep"></div>

    <div class="filter-group">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All Stations</button>
      <button class="filter-btn fast" id="filterFast" onclick="setFilter('fast')">⚡ Fast DC Only</button>
    </div>
  </div>

  <!-- MAP -->
  <div style="position:relative; flex:1;">
    <div id="stationsMap" style="height:100%;"></div>
    <div id="loadingOverlay"><div class="load-dot"></div> Loading stations…</div>
    <div class="map-float-legend">
      <h4>Power Class</h4>
      <div class="legend-row"><div class="legend-dot" style="background:#4ade80"></div> Ultra Fast DC (≥150 kW)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#60a5fa"></div> Fast DC (50–149 kW)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#fbbf24"></div> AC High (22–49 kW)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#94a3b8"></div> AC Standard (&lt;22 kW)</div>
    </div>
  </div>
</div>

<script src="/static/stations.js"></script>
</body>
</html>
